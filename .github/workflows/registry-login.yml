# Autentica no Magalu Cloud Container Registry (br-se1) via docker login.
# Credenciais vem de secrets criptografados (NUNCA em texto no YAML):
#   MGC_REGISTRY_USER      -> username (access key UUID)
#   MGC_REGISTRY_PASSWORD  -> password/token
# Boas praticas aplicadas:
#   - secrets passados via `env:` (evita injecao no script)
#   - `--password-stdin` (senha nao aparece em `ps`/argv)
#   - GitHub mascara automaticamente o valor dos secrets nos logs
name: Registry Login

on:
  workflow_dispatch:

env:
  REGISTRY: container-registry.br-se1.magalu.cloud

jobs:
  login:
    name: Docker login (Magalu br-se1)
    runs-on: ubuntu-latest

    steps:
      - name: Docker login
        env:
          MGC_USER: ${{ secrets.MGC_REGISTRY_USER }}
          MGC_PASS: ${{ secrets.MGC_REGISTRY_PASSWORD }}
        run: |
          if [ -z "$MGC_USER" ] || [ -z "$MGC_PASS" ]; then
            echo "ERRO: secrets MGC_REGISTRY_USER/MGC_REGISTRY_PASSWORD nao definidos" >&2
            exit 1
          fi
          echo "$MGC_PASS" | docker login "$REGISTRY" -u "$MGC_USER" --password-stdin

      - name: Confirmar sessao autenticada
        run: |
          echo "Login concluido em $REGISTRY."
          echo "Config gerado (sem segredos):"
          # Mostra que existe uma credencial gravada para o registry, sem revelar valor.
          jq '.auths | keys' ~/.docker/config.json 2>/dev/null \
            || grep -o "$REGISTRY" ~/.docker/config.json

      - name: Logout (limpa credencial do runner)
        if: always()
        run: docker logout "$REGISTRY"
