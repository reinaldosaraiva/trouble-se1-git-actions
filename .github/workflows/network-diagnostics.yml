# Diagnostico VERBOSO de conectividade com o Magalu Cloud Container Registry (br-se1).
# Cada step imprime o maximo de detalhe e NAO aborta no meio (set +e) — o objetivo
# e coletar evidencia, nao passar/falhar. Achado atual: TCP/443 abre, mas TLS quebra.
name: Registry Connectivity

on:
  workflow_dispatch:

env:
  REGISTRY: container-registry.br-se1.magalu.cloud
  PORT: "443"

jobs:
  connectivity:
    name: Registry Connectivity (br-se1) — verbose
    runs-on: ubuntu-latest

    steps:
      - name: Ambiente e IP de saida
        continue-on-error: true
        shell: bash
        run: |
          set +e
          echo "===== IDENTIDADE DO RUNNER ====="
          echo "Hostname : $(hostname)"
          echo "Kernel   : $(uname -a)"
          echo "----- IPs locais -----"
          ip -brief address 2>/dev/null || ip addr
          echo "----- IP de saida (egress publico) -----"
          curl -s --max-time 10 https://ifconfig.me; echo
          curl -s --max-time 10 https://ipinfo.io/json; echo
          echo "----- openssl version -----"
          openssl version -a
          echo "----- curl version -----"
          curl --version

      - name: DNS (detalhado)
        continue-on-error: true
        shell: bash
        run: |
          set +e
          echo "===== DNS: $REGISTRY ====="
          echo "----- getent hosts -----"
          getent hosts "$REGISTRY"
          echo "----- getent ahosts (todos os A/AAAA) -----"
          getent ahosts "$REGISTRY"
          echo "----- /etc/resolv.conf -----"
          cat /etc/resolv.conf 2>/dev/null
          echo "----- host / nslookup (se disponivel) -----"
          command -v host >/dev/null && host "$REGISTRY"
          command -v nslookup >/dev/null && nslookup "$REGISTRY"

      - name: TCP 443 (com timing)
        continue-on-error: true
        shell: bash
        run: |
          set +e
          IP=$(getent hosts "$REGISTRY" | awk '{print $1; exit}')
          echo "===== TCP $REGISTRY ($IP):$PORT ====="
          START=$(date +%s.%N)
          timeout 10 bash -c "exec 3<>/dev/tcp/$REGISTRY/$PORT"
          RC=$?
          END=$(date +%s.%N)
          echo "exit code: $RC   (0 = TCP aberto)"
          echo "tempo do connect: $(echo "$END - $START" | bc 2>/dev/null || echo "?") s"
          echo "----- curl --connect-only (so TCP) -----"
          curl -v --max-time 10 --connect-timeout 10 "telnet://$REGISTRY:$PORT" 2>&1 | head -20

      - name: TLS handshake (openssl VERBOSO)
        continue-on-error: true
        shell: bash
        run: |
          set +e
          echo "===== TLS s_client (com SNI, showcerts, state, tlsextdebug) ====="
          echo | timeout 20 openssl s_client \
            -connect "$REGISTRY:$PORT" \
            -servername "$REGISTRY" \
            -showcerts -state -tlsextdebug -status 2>&1
          echo "openssl s_client exit code: $?"

          echo
          echo "===== Testando versoes especificas de TLS ====="
          for v in tls1_3 tls1_2 tls1_1 tls1; do
            printf '%-8s -> ' "$v"
            echo | timeout 15 openssl s_client -"$v" \
              -connect "$REGISTRY:$PORT" -servername "$REGISTRY" >/dev/null 2>&1
            echo "exit=$?"
          done

          echo
          echo "===== Resumo do certificado (se o handshake passar) ====="
          echo | timeout 20 openssl s_client -connect "$REGISTRY:$PORT" \
            -servername "$REGISTRY" 2>/dev/null \
            | openssl x509 -noout -subject -issuer -dates -ext subjectAltName 2>&1

      - name: HTTPS /v2/ (curl -v com e sem validacao)
        continue-on-error: true
        shell: bash
        run: |
          set +e
          echo "===== curl -v (COM validacao de certificado) ====="
          curl -v --max-time 25 "https://$REGISTRY/v2/" 2>&1
          echo "curl (verify) exit code: $?"

          echo
          echo "===== curl -vk (SEM validacao — distingue cert x rede/TLS) ====="
          curl -vk --max-time 25 "https://$REGISTRY/v2/" 2>&1
          echo "curl (insecure) exit code: $?"

          echo
          echo "===== Status HTTP resumido -----"
          for opt in "" "-k"; do
            code=$(curl $opt -sS -o /dev/null -w '%{http_code}' --max-time 25 \
              "https://$REGISTRY/v2/" 2>/dev/null || echo "000")
            echo "curl $opt -> HTTP $code  (200/401 = registry alcancado)"
          done

      - name: MTR TCP/443 (rota)
        continue-on-error: true
        shell: bash
        run: |
          set +e
          sudo apt-get update -qq
          sudo apt-get install --yes -qq mtr-tiny traceroute
          echo "===== MTR TCP 443 ====="
          sudo mtr --report --report-wide --report-cycles 10 \
            --tcp --port "$PORT" "$REGISTRY"
          echo
          echo "===== traceroute TCP 443 (fallback) ====="
          sudo traceroute -T -p "$PORT" -w 2 -q 1 "$REGISTRY" 2>&1 | head -40
