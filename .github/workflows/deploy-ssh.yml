# Pipeline de TESTE: build no CI -> transfere imagem via SSH -> refresh do
# container isolado 'trouble-deploy-test' no host. NAO toca em producao.
#
# O caminho GitHub-Azure -> Magalu (201.23.x) sofre reset intermitente (mesmo
# fenomeno do container registry). Mitigacao:
#   - SSH ControlMaster: 1 conexao com RETRY, reusada por todas as etapas
#     (evita novos key-exchange, onde o reset costuma ocorrer).
#   - retry adicional na transferencia (etapa mais longa).
#
# Secrets:
#   DEPLOY_SSH_KEY      -> chave privada SSH (sem passphrase)
#   DEPLOY_HOST         -> IP/host do servidor
#   DEPLOY_KNOWN_HOSTS  -> host key (ssh-keyscan) para known_hosts
name: Deploy SSH (teste)

on:
  workflow_dispatch:

env:
  CONTAINER: trouble-deploy-test
  IMAGE: trouble-deploy-test

jobs:
  deploy:
    name: Build + refresh via SSH
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build da imagem (detalhado)
        run: |
          TAG="${{ github.run_number }}"
          echo "=================================================="
          echo " BUILD  |  $IMAGE:$TAG"
          echo "=================================================="
          set -x
          docker build -t "$IMAGE:$TAG" -t "$IMAGE:latest" .
          set +x
          echo "----- imagens locais -----"
          docker images "$IMAGE"
          echo "----- inspect (sha / tamanho / criado) -----"
          docker image inspect "$IMAGE:$TAG" \
            --format 'ID={{.Id}}{{"\n"}}Created={{.Created}}{{"\n"}}Size={{.Size}} bytes{{"\n"}}Arch={{.Architecture}}/{{.Os}}'
          echo "IMAGE_TAG=$TAG" >> "$GITHUB_ENV"

      - name: Preparar SSH (chave + known_hosts + ControlMaster)
        run: |
          echo "=================================================="
          echo " SETUP SSH (ControlMaster)"
          echo "=================================================="
          mkdir -p ~/.ssh
          # chave privada PRECISA de newline final, senao o OpenSSH rejeita (255)
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          printf '%s\n' "${{ secrets.DEPLOY_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts
          cat > ~/.ssh/config <<EOF
          Host deploy
            HostName ${{ secrets.DEPLOY_HOST }}
            User ubuntu
            IdentityFile ~/.ssh/id_rsa
            UserKnownHostsFile ~/.ssh/known_hosts
            BatchMode yes
            ConnectTimeout 12
            ControlMaster auto
            ControlPath ~/.ssh/cm-%C
            ControlPersist 300
            ServerAliveInterval 15
            ServerAliveCountMax 4
          EOF
          chmod 600 ~/.ssh/config
          echo "----- fingerprint da chave -----"
          ssh-keygen -l -f ~/.ssh/id_rsa
          echo "----- host keys confiaveis -----"
          cut -d' ' -f2-3 ~/.ssh/known_hosts | sort -u

      - name: Conectar (ControlMaster com retry contra reset)
        run: |
          echo "=================================================="
          echo " CONNECT (retry ate a rede colaborar)"
          echo "=================================================="
          n=0; max=10
          until ssh deploy 'echo ok' >/dev/null 2>&1; do
            n=$((n+1))
            echo "tentativa $n/$max: reset/timeout, aguardando 8s..."
            [ "$n" -ge "$max" ] && { echo "SSH FALHOU apos $max tentativas" >&2; exit 1; }
            sleep 8
          done
          echo "CONEXAO SSH ESTABELECIDA (master ativo, sera reusado pelas proximas etapas)"
          echo "----- info do host -----"
          ssh deploy '
            echo "usuario/host : $(whoami)@$(hostname)"
            echo "uptime       : $(uptime -p 2>/dev/null || uptime)"
            echo "kernel       : $(uname -r)"
            echo "docker       : $(docker --version)"
            echo "--- disco / ---"; df -h / | tail -n +1
            echo "--- containers atuais (contexto) ---"
            docker ps --format "{{.Names}}\t{{.Image}}\t{{.Status}}"'

      - name: Transferir imagem (docker save | ssh docker load, com retry)
        run: |
          echo "=================================================="
          echo " TRANSFER  |  $IMAGE:$IMAGE_TAG"
          echo "=================================================="
          SIZE=$(docker save "$IMAGE:$IMAGE_TAG" | wc -c)
          echo "tamanho do tar (nao comprimido): $SIZE bytes (~$(( SIZE/1024/1024 )) MB)"
          n=0; max=4
          until docker save "$IMAGE:$IMAGE_TAG" | gzip \
                  | ssh deploy 'gunzip | docker load'; do
            n=$((n+1))
            echo "transfer resetou, retry $n/$max em 6s..."
            [ "$n" -ge "$max" ] && { echo "TRANSFER FALHOU apos $max" >&2; exit 1; }
            sleep 6
          done
          echo "----- imagem presente no host -----"
          ssh deploy "docker images $IMAGE --format '{{.Repository}}:{{.Tag}}  {{.ID}}  {{.Size}}'"

      - name: Refresh do container (recria com a imagem nova)
        run: |
          echo "=================================================="
          echo " REFRESH  |  container $CONTAINER"
          echo "=================================================="
          ssh deploy "set -e
             echo '----- ESTADO ANTES -----'
             docker ps -a --filter name=$CONTAINER \
               --format '{{.Names}}  {{.Image}}  {{.Status}}  (id {{.ID}})' || echo '(nao existia)'
             echo '----- removendo container antigo (se houver) -----'
             docker rm -f $CONTAINER 2>/dev/null && echo 'removido' || echo 'nada para remover'
             echo '----- subindo container novo -----'
             NEWID=\$(docker run -d --name $CONTAINER --restart unless-stopped \
               $IMAGE:$IMAGE_TAG tail -f /dev/null)
             echo \"novo container id: \$NEWID\"
             echo '----- ESTADO DEPOIS -----'
             docker ps --filter name=$CONTAINER \
               --format '{{.Names}}  {{.Image}}  {{.Status}}  (id {{.ID}})'"

      - name: Verificar deploy (evidencia final)
        run: |
          echo "=================================================="
          echo " VERIFY"
          echo "=================================================="
          ssh deploy "echo '----- inspect do container -----'
             docker inspect -f 'container={{.Name}}{{\"\n\"}}image={{.Config.Image}}{{\"\n\"}}imageID={{.Image}}{{\"\n\"}}status={{.State.Status}}{{\"\n\"}}started={{.State.StartedAt}}{{\"\n\"}}restart={{.HostConfig.RestartPolicy.Name}}' $CONTAINER
             echo '----- conteudo da imagem (prova do refresh) -----'
             docker exec $CONTAINER cat /hello.txt
             echo '----- logs do container -----'
             docker logs --tail 20 $CONTAINER 2>&1 || true"
          echo ""
          echo "DEPLOY OK -> $CONTAINER atualizado para $IMAGE:$IMAGE_TAG"

      - name: Fechar master SSH
        if: always()
        run: ssh -O exit deploy 2>/dev/null || true
