# Build da imagem + docker login + push no Magalu Container Registry (br-se1).
# Segue o fluxo do tutorial "example-complete".
#
# Secrets (criptografados, nunca no YAML):
#   MGC_REGISTRY_USER      -> username (access key)
#   MGC_REGISTRY_PASSWORD  -> password/token
#
# Input:
#   registry_name -> <nome-do-registro> criado via `mgc container-registry
#                    registries create`. Vazio = build + login apenas (pula push).
name: Registry Build & Push

on:
  workflow_dispatch:
    inputs:
      registry_name:
        description: "nome-do-registro (namespace Magalu). Vazio = so build+login."
        required: false
        default: ""

env:
  REGISTRY: container-registry.br-se1.magalu.cloud
  IMAGE: trouble-se1
  TAG: ${{ github.run_number }}

jobs:
  build-push:
    name: Build, login e push (br-se1)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build da imagem (evidencia de build)
        run: |
          set -x
          docker build -t "$IMAGE:$TAG" -t "$IMAGE:latest" .
          set +x
          echo "===== imagens locais ====="
          docker images "$IMAGE"
          echo "===== inspect (id + criado) ====="
          docker image inspect "$IMAGE:$TAG" \
            --format 'ID={{.Id}}  Created={{.Created}}  Size={{.Size}} bytes'

      - name: Precheck de conectividade (/v2/)
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 \
            "https://$REGISTRY/v2/" || echo "000")
          echo "GET https://$REGISTRY/v2/ -> HTTP $code (200/401 = alcancado)"

      - name: Docker login (com retry — contorna reset intermitente do runner)
        env:
          MGC_USER: ${{ secrets.MGC_REGISTRY_USER }}
          MGC_PASS: ${{ secrets.MGC_REGISTRY_PASSWORD }}
        run: |
          n=0; max=5
          until [ "$n" -ge "$max" ]; do
            n=$((n+1))
            echo "----- tentativa de login $n/$max -----"
            if echo "$MGC_PASS" | docker login "$REGISTRY" -u "$MGC_USER" --password-stdin; then
              echo "LOGIN OK (tentativa $n)"
              exit 0
            fi
            echo "login falhou (possivel connection reset), aguardando 6s..."
            sleep 6
          done
          echo "LOGIN FALHOU apos $max tentativas" >&2
          exit 1

      - name: Tag e push (so se registry_name informado)
        if: ${{ inputs.registry_name != '' }}
        run: |
          set -x
          FULL="$REGISTRY/${{ inputs.registry_name }}/$IMAGE"
          docker tag "$IMAGE:$TAG"    "$FULL:$TAG"
          docker tag "$IMAGE:latest"  "$FULL:latest"
          docker push "$FULL:$TAG"
          docker push "$FULL:latest"
          set +x
          echo "PUSH OK -> $FULL:$TAG e :latest"

      - name: Push pulado (sem registry_name)
        if: ${{ inputs.registry_name == '' }}
        run: |
          echo "registry_name vazio: build + login validados; push PULADO."
          echo "Para publicar: rode de novo informando o nome do registro."

      - name: Logout
        if: always()
        run: docker logout "$REGISTRY" || true
